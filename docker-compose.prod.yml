# ─────────────────────────────────────────────────────────────────────────
#  Продакшн-стенд образовательной платформы «Инквайри».
#
#  Запуск (все переменные и секреты берутся из .env.prod):
#      docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
#  .env.prod нужен дважды и по разным причинам:
#    --env-file  → подстановка ${...} в этом файле (пароли БД/Redis, домен)
#    env_file:   → передача переменных внутрь контейнеров приложения
#  Поэтому флаг обязателен: без него compose возьмёт dev'овый .env из корня.
#
#  Данные (БД, дампы) остаются на сервере — размещение в юрисдикции РК
#  обеспечивается выбором площадки (DP-2 §13, см. COMPLIANCE.md).
# ─────────────────────────────────────────────────────────────────────────

name: edu-platform

# Логи ротируем: без лимита json-file забивает диск и роняет весь стенд.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Общая часть api/worker: один и тот же образ, разные команды.
x-backend: &backend
  image: edu-platform/backend:${APP_VERSION:-1.1.0}
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
    target: runtime
  restart: unless-stopped
  init: true
  logging: *logging
  env_file:
    - .env.prod
  environment:
    NODE_ENV: production
    # Строки подключения собираем здесь, а не в .env.prod: пароль хранится
    # в одном месте. environment переопределяет env_file.
    DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER не задан}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB не задан}?schema=public&connection_limit=10&pool_timeout=20
    REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD не задан}@redis:6379
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  networks:
    - core

services:
  # ═══════════════════════════════════════════════════════════════════
  #  Данные
  # ═══════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан}
    volumes:
      - edu_pgdata:/var/lib/postgresql/data
    # Портов наружу нет: доступ только из сети core. Для psql —
    # docker compose exec postgres psql -U "$POSTGRES_USER" "$POSTGRES_DB"
    expose:
      - "5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - core

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # noeviction обязателен: при maxmemory-policy allkeys-lru Redis выбросит
    # ключи BullMQ и очередь генерации потеряет задачи.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD не задан}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
    environment:
      # redis-cli читает пароль отсюда — в аргументах команды он был бы
      # виден в `ps` внутри контейнера.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD не задан}
    volumes:
      - edu_redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - core

  # ═══════════════════════════════════════════════════════════════════
  #  Миграции — одноразовый контейнер, блокирует старт api и worker
  # ═══════════════════════════════════════════════════════════════════
  migrate:
    image: edu-platform/backend-migrator:${APP_VERSION:-1.1.0}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migrator
    command: ["npx", "--no-install", "prisma", "migrate", "deploy"]
    restart: "no"
    logging: *logging
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - core

  # ═══════════════════════════════════════════════════════════════════
  #  Приложение
  # ═══════════════════════════════════════════════════════════════════
  api:
    <<: *backend
    command: ["node", "dist/server.js"]
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # /health отдаёт 200 даже при status=degraded — проверяем тело ответа.
    healthcheck:
      test: ["CMD", "node", "/app/deploy/healthcheck.mjs"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 40s
    stop_grace_period: 30s
    networks:
      - core
      - edge
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1g}

  worker:
    <<: *backend
    # Генерация материалов и обслуживающие задачи (BullMQ). В проде — отдельный
    # процесс: server.ts поднимает воркеры в себе только в development.
    command: ["node", "dist/queue/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Healthcheck'а нет: у воркера нет HTTP-порта, а проверка «процесс жив»
    # ничего не доказывает. Состояние очереди видно в метриках api.
    #
    # Долгий grace period: worker.close() дожидается завершения текущей
    # LLM-генерации, чтобы задача не осталась в статусе RUNNING.
    stop_grace_period: 180s
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-1g}

  # ═══════════════════════════════════════════════════════════════════
  #  Веб-слой: TLS + статика SPA + прокси на API
  # ═══════════════════════════════════════════════════════════════════
  web:
    image: edu-platform/web:${APP_VERSION:-1.1.0}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runtime
    restart: unless-stopped
    logging: *logging
    environment:
      # Домен, на который Caddy выпустит сертификат Let's Encrypt.
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS не задан (например edu.example.kz)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL не задан}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      # Сертификаты и ключи ACME. Том обязателен: без него при каждом
      # пересоздании контейнера Caddy заново выпускает сертификат и
      # упирается в rate limit Let's Encrypt (5 штук на домен в неделю).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    # Healthcheck'а нет намеренно: админ-API Caddy выключен (admin off),
    # а внешняя доступность сайта проверяется мониторингом по /health.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # порты 80/443
    networks:
      - edge

  # ═══════════════════════════════════════════════════════════════════
  #  Резервное копирование
  # ═══════════════════════════════════════════════════════════════════
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      # Дампы содержат персональные данные — каталог на хосте под chmod 700
      # и обязательно вне git (см. .gitignore).
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      # Ждём миграций: первый дамп снимается сразу при старте, и без этого
      # он попадает на ещё пустую схему (проверено — получается пустой файл).
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    networks:
      - core

volumes:
  edu_pgdata:
  edu_redisdata:
  caddy_data:
  caddy_config:

networks:
  # core — приложение и данные. Postgres/Redis сюда, но не в edge.
  core:
  # edge — только web и api: у СУБД нет причин быть на одной сети с внешним периметром.
  edge:
